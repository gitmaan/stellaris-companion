appId: com.stellaris.companion
productName: Stellaris Companion

directories:
  output: dist

beforePack: scripts/beforePack.js

files:
  - main.js
  - main/**/*
  - preload.js
  - renderer/dist/**/*
  - assets/**/*

extraResources:
  # PyInstaller backend (onedir layout): dist-python/stellaris-backend/** -> Resources/python-backend/**
  # This keeps the executable path stable:
  # - macOS/Linux: python-backend/stellaris-backend
  # - Windows:     python-backend/stellaris-backend.exe
  - from: ../dist-python/stellaris-backend
    to: python-backend
    filter:
      - "**/*"
  # Rust parser binary (stellaris-parser)
  # Binaries are placed in bin/ folder at project root
  - from: ../bin
    to: rust-parser
    filter:
      - "**/*"

mac:
  category: public.app-category.games
  icon: assets/icon.png
  minimumSystemVersion: "12.0"
  target:
    # electron-updater on macOS requires a .zip artifact for auto-updates.
    # Keep .dmg for manual installs, but publish .zip so updates work.
    - target: dmg
    - target: zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Credentials and team ID are provided by CI environment variables.
  notarize: true
  extendInfo:
    NSDocumentsFolderUsageDescription: "Stellaris Companion needs access to your Documents folder to find Stellaris save files."

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # No Windows code-signing cert yet; keep executable unsigned.
  signExecutable: false
  # Allow auto-updates on Windows even while unsigned.
  # When we add a proper WIN_CSC cert, switch this back to true.
  verifyUpdateCodeSignature: false

linux:
  icon: assets/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Game

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: gitmaan
  repo: stellaris-companion
  # Matrix jobs upload to a shared draft. The release workflow publishes only
  # after every platform asset and the combined macOS update feed are ready.
  releaseType: draft

releaseInfo:
  releaseNotesFile: release-notes.md
