name: Feedback service
on:
  pull_request:
    branches: [main]
    paths: ['workers/stellaris-feedback/**', '.github/workflows/feedback.yml']
  push:
    branches: [main]
    paths: ['workers/stellaris-feedback/**', '.github/workflows/feedback.yml']
jobs:
  feedback-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/stellaris-feedback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/stellaris-feedback/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
