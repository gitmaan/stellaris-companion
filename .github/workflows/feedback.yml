name: Feedback ownership
on:
  pull_request:
    branches: [main]
    paths: ['workers/stellaris-feedback/**', '.github/workflows/feedback.yml']
  push:
    branches: [main]
    paths: ['workers/stellaris-feedback/**', '.github/workflows/feedback.yml']
jobs:
  feedback-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the shared service in its canonical repository
        run: |
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(
              ['git', 'ls-files', 'workers/stellaris-feedback'], text=True
          ).splitlines()
          assert files == ['workers/stellaris-feedback/README.md'], (
              'The feedback service is owned by gitmaan/stellaris-companion-site. '
              'Do not restore a second deployable Worker here: it can overwrite '
              'the private survey and website report routes.'
          )
          PY
