name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - '.github/workflows/desktop.yml'

jobs:
  desktop-test:
    name: Desktop - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            electron/renderer/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install renderer dependencies
        working-directory: electron/renderer
        run: npm ci

      - name: Set up Python for the MCP integration check
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: python -m pip install .

      - name: Run main-process tests
        working-directory: electron
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: npm test

      - name: Run localization tests
        working-directory: electron
        run: npm run test:localization

      - name: Build renderer
        working-directory: electron
        run: npm run build:renderer

  desktop-e2e:
    name: Desktop E2E - Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            electron/renderer/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install renderer dependencies
        working-directory: electron/renderer
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build:renderer

      - name: Run Electron journeys
        working-directory: electron
        run: xvfb-run --auto-servernum npx playwright test
        env:
          E2E_NO_SANDBOX: '1'

  desktop-e2e-windows:
    name: Desktop E2E - Windows localization smoke
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            electron/renderer/package-lock.json

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Install renderer dependencies
        working-directory: electron/renderer
        run: npm ci

      - name: Build renderer
        working-directory: electron
        run: npm run build:renderer

      - name: Run Windows Electron localization smoke
        working-directory: electron
        run: npx playwright test e2e/windows-localization-smoke.spec.js

      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-localization-smoke
          path: electron/test-results
          if-no-files-found: ignore
